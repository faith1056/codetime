<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeTime — Coding Time Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <h1>CodeTime</h1>
        <p>Track your coding time. Understand your progress.</p>
        <button id="logout-button" type="button" class="secondary" hidden>
            Log out
        </button>
    </header>

    <main>
        <section id="login-section">
            <h2>Log in</h2>
            <form id="login-form">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" autocomplete="username" required>

                <label for="login-password">Password</label>
                <input id="login-password" type="password" autocomplete="current-password" required>

                <label class="checkbox-row" for="show-password">
                    <input id="show-password" type="checkbox">
                    Show password
                </label>

                <button id="login-button" type="submit" class="primary">Log in</button>
                <p id="login-error" role="alert"></p>
            </form>
            <p class="hint">No account yet? Run <code>codetime register</code> in a terminal.</p>
        </section>

        <section class="dash" hidden>
            <h2>Current Session</h2>
            <p id="session-status">No active session</p>
            <button id="start-button" type="button">Start Session</button>
            <button id="stop-button" type="button" disabled>Stop Session</button>
        </section>

        <section class="dash" hidden>
            <h2>Today's Progress</h2>
            <p>
                Total time:
                <strong id="today-total">0 minutes</strong>
            </p>
        </section>

        <section class="dash" hidden>
            <h2>Recent Sessions</h2>
            <div id="recent-sessions">
                <p>Loading recent sessions...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>CodeTime — Build better habits, one session at a time.</p>
    </footer>

    <script>
        const TOKEN_KEY = "codetime_account_token";
        const TOKEN_HEADER = "X-CodeTime-Account-Token";

        const loginSection = document.getElementById("login-section");
        const dashSections = document.querySelectorAll(".dash");
        const loginForm = document.getElementById("login-form");
        const loginEmail = document.getElementById("login-email");
        const loginPassword = document.getElementById("login-password");
        const showPassword = document.getElementById("show-password");
        const loginButton = document.getElementById("login-button");
        const loginError = document.getElementById("login-error");
        const logoutButton = document.getElementById("logout-button");
        const startButton = document.getElementById("start-button");
        const stopButton = document.getElementById("stop-button");
        const sessionStatus = document.getElementById("session-status");
        const todayTotal = document.getElementById("today-total");
        const recentSessions = document.getElementById("recent-sessions");

        let memoryToken = null;
        let actionInFlight = false;
        let refreshing = false;

        class AuthError extends Error {}

        function getToken() {
            try {
                return sessionStorage.getItem(TOKEN_KEY) || memoryToken;
            } catch (error) {
                return memoryToken;
            }
        }

        function setToken(token) {
            memoryToken = token;
            try { sessionStorage.setItem(TOKEN_KEY, token); } catch (error) {}
        }

        function clearToken() {
            memoryToken = null;
            try { sessionStorage.removeItem(TOKEN_KEY); } catch (error) {}
        }

        function resetPasswordField() {
            loginPassword.value = "";
            showPassword.checked = false;
            loginPassword.type = "password";
        }

        function showLogin(message) {
            for (const section of dashSections) { section.hidden = true; }
            loginSection.hidden = false;
            logoutButton.hidden = true;
            recentSessions.replaceChildren();
            sessionStatus.textContent = "No active session";
            todayTotal.textContent = "0 minutes";
            resetPasswordField();
            loginError.textContent = message || "";
        }

        function showDashboard() {
            loginSection.hidden = true;
            for (const section of dashSections) { section.hidden = false; }
            logoutButton.hidden = false;
            loginError.textContent = "";
            refreshDashboard();
            refreshRecentSessions();
        }

        async function api(path, options = {}) {
            const token = getToken();
            if (!token) {
                showLogin("");
                throw new AuthError("Not logged in.");
            }

            const headers = { ...(options.headers || {}), [TOKEN_HEADER]: token };
            const response = await fetch(path, { ...options, headers });

            if (response.status === 401) {
                clearToken();
                showLogin("Your session expired. Please log in again.");
                throw new AuthError("Session expired.");
            }
            return response;
        }

        async function readJson(response) {
            try { return await response.json(); } catch (error) { return {}; }
        }

        function describeError(error, fallback) {
            return error instanceof TypeError
                ? "Unable to connect to CodeTime."
                : (error.message || fallback);
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remainingSeconds = seconds % 60;

            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            }
            if (minutes > 0) {
                return `${minutes} minute${minutes === 1 ? "" : "s"}`;
            }
            return `${remainingSeconds} second${remainingSeconds === 1 ? "" : "s"}`;
        }

        async function refreshDashboard() {
            if (!getToken() || refreshing) { return; }
            refreshing = true;

            try {
                const response = await api("/api/status");
                const data = await readJson(response);

                if (!response.ok) {
                    throw new Error("Could not load session status.");
                }

                const session = data.active_session;

                if (session) {
                    sessionStatus.textContent =
                        `Running: ${session.project} (${formatDuration(session.elapsed_seconds)})`;
                } else {
                    sessionStatus.textContent = "No active session";
                }

                if (!actionInFlight) {
                    startButton.disabled = Boolean(session);
                    stopButton.disabled = !session;
                }

                todayTotal.textContent = formatDuration(data.today_seconds);
            } catch (error) {
                if (error instanceof AuthError) { return; }
                sessionStatus.textContent = describeError(error, "Could not load session status.");
                console.error("Dashboard error:", error);
            } finally {
                refreshing = false;
            }
        }

        async function refreshRecentSessions() {
            if (!getToken()) { return; }

            try {
                const response = await api("/api/sessions");
                const data = await readJson(response);

                if (!response.ok) {
                    throw new Error("Could not load recent sessions.");
                }

                recentSessions.replaceChildren();

                if (data.sessions.length === 0) {
                    const message = document.createElement("p");
                    message.textContent = "No sessions recorded yet.";
                    recentSessions.appendChild(message);
                    return;
                }

                for (const session of data.sessions) {
                    const card = document.createElement("article");
                    card.className = "session-entry";

                    const projectName = document.createElement("h3");
                    projectName.textContent = session.project;

                    const startTime = document.createElement("p");
                    startTime.textContent =
                        `Started: ${new Date(session.started_at).toLocaleString()}`;

                    const duration = document.createElement("p");
                    duration.textContent = session.active
                        ? "Status: In progress"
                        : `Duration: ${formatDuration(session.duration_seconds)}`;

                    card.appendChild(projectName);
                    card.appendChild(startTime);
                    card.appendChild(duration);
                    recentSessions.appendChild(card);
                }
            } catch (error) {
                if (error instanceof AuthError) { return; }
                recentSessions.textContent = describeError(error, "Unable to load recent sessions.");
                console.error("Recent sessions error:", error);
            }
        }

        async function runAction(path, options, failureMessage) {
            if (actionInFlight) { return; }
            actionInFlight = true;
            startButton.disabled = true;
            stopButton.disabled = true;

            try {
                const response = await api(path, options);
                const data = await readJson(response);

                if (!response.ok) {
                    throw new Error(data.detail || failureMessage);
                }
            } catch (error) {
                if (!(error instanceof AuthError)) {
                    alert(describeError(error, failureMessage));
                }
            } finally {
                actionInFlight = false;
                if (getToken()) {
                    await refreshDashboard();
                    await refreshRecentSessions();
                }
            }
        }

        startButton.addEventListener("click", () => {
            runAction(
                "/api/start",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ project: "CodeTime dashboard" })
                },
                "Could not start session."
            );
        });

        stopButton.addEventListener("click", () => {
            runAction("/api/stop", { method: "POST" }, "Could not stop session.");
        });

        showPassword.addEventListener("change", () => {
            loginPassword.type = showPassword.checked ? "text" : "password";
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            loginButton.disabled = true;
            loginError.textContent = "";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: loginEmail.value,
                        password: loginPassword.value
                    })
                });
                const data = await readJson(response);

                if (!response.ok || !data.token) {
                    loginError.textContent =
                        typeof data.detail === "string" ? data.detail : "Could not log in.";
                    return;
                }

                setToken(data.token);
                resetPasswordField();
                showDashboard();
            } catch (error) {
                loginError.textContent = describeError(error, "Could not log in.");
            } finally {
                loginButton.disabled = false;
            }
        });

        logoutButton.addEventListener("click", async () => {
            logoutButton.disabled = true;
            const token = getToken();

            try {
                if (token) {
                    await fetch("/api/logout", {
                        method: "POST",
                        headers: { [TOKEN_HEADER]: token }
                    });
                }
            } catch (error) {
                console.error("Logout request failed:", error);
            } finally {
                clearToken();
                logoutButton.disabled = false;
                showLogin("You have been logged out.");
            }
        });

        if (getToken()) { showDashboard(); } else { showLogin(""); }

        setInterval(refreshDashboard, 1000);
    </script>
</body>
</html>
